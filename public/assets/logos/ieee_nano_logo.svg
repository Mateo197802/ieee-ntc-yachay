<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- White angular background capsule badge matching reference image -->
  <polygon points="0,0 400,0 375,80 0,80" fill="#FFFFFF"/>
  <polygon points="375,80 400,0 420,0 395,80" fill="#0587BD" opacity="0.8"/>
  
  <!-- Left Hexagon Badge with NTC -->
  <g transform="translate(16, 10)">
    <!-- Outer Cyan Hexagon -->
    <polygon points="26,2 52,17 52,47 26,62 0,47 0,17" fill="#04608E" stroke="#0587BD" stroke-width="2"/>
    <!-- Inner Hexagon border -->
    <polygon points="26,6 47,18 47,45 26,57 5,45 5,18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- NTC letters -->
    <text x="26" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NTC</text>
  </g>

  <!-- IEEE NANO Title Text -->
  <g transform="translate(76, 12)">
    <text x="0" y="24" font-family="'Anton', 'Inter', system-ui, sans-serif" font-weight="700" font-size="25" fill="#1F3E65" letter-spacing="1.5">IEEE NANO</text>
    <text x="0" y="38" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#04608E" letter-spacing="1.8">NANOTECHNOLOGY COUNCIL</text>
    <text x="0" y="52" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="8" fill="#465D64" letter-spacing="0.4">Yachay Tech University | IEEE Student Branch</text>
  </g>
</svg>
